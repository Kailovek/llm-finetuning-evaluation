[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-finetuning-evaluation"
version = "0.1.0"
description = "Dataset, opt-in LoRA, inference, and measured evaluation toolbox"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Hzhikai"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
training = [
  "torch>=2.4",
  "transformers>=4.45,<6.0",
  "peft>=0.13,<1.0",
  "datasets>=3,<5",
  "accelerate>=1,<2",
]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1.0", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
